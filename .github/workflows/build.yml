name: Building Command


on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
      ARTIFACTORY_USER: ${{secrets.ARTIFACTORY_USERNAME}}
    steps:
    - uses: actions/checkout@v4
    - name: prepare runner
      run: | 
        sudo apt update && sudo apt -y install make autoconf python3 python3-pip cmake libgl-dev libgl1-mesa-dev xkb-data libx11-xcb-dev libfontenc-dev libxaw7-dev libxcomposite-dev libxcursor-dev libxdamage-dev libxfixes-dev libxi-dev libxinerama-dev libxkbfile-dev libxmu-dev libxmuu-dev libxpm-dev libxrandr-dev libxres-dev libxss-dev libxtst-dev libxv-dev libxxf86vm-dev libxcb-glx0-dev libxcb-render-util0-dev libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-dri3-dev libxcb-cursor-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev libxcb-util-dev uuid-dev
        sudo pip install --ignore-installed --upgrade conan
        conan profile detect
        conan remote add protestator-conan $ARTIFACTORY_URL
        conan remote login -p $ARTIFACTORY_TOKEN protestator-conan $ARTIFACTORY_USER
        conan remote remove conancenter
    - name: prepare dependencies
      run: |
       mkdir build && cd build
       conan install .. --build missing -o "&:with_check=True"
    - name: build sysmlv2lib
      run: |
        ls -al
        cd build
        conan build .. --version=wip -o "&:with_check=True"
    - name: test
      run: |
        # the dependencies are shared libraries in the Conan cache: conanrun.sh puts them on LD_LIBRARY_PATH
        source build/Release/generators/conanrun.sh
        ctest --test-dir build/Release --output-on-failure --timeout 1800
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-logs
        path: build/Release/Testing/Temporary/

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
      ARTIFACTORY_USER: ${{secrets.ARTIFACTORY_USERNAME}}
      CONAN_HOME: C:\c2
    steps:
    - name: enable long paths
      run: git config --system core.longpaths true
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/cache@v4
      with:
        path: C:\c2\p
        key: conan-windows-check-${{ hashFiles('conanfile.py') }}
        restore-keys: conan-windows-check-
    - name: prepare runner
      run: |
        pip install --upgrade conan
        conan profile detect --force
        # MSVC is detected with C++14, the project and antlr4 need a newer standard
        sed -i 's/^compiler.cppstd=.*/compiler.cppstd=20/' "$(conan profile path default)"
        conan remote add --force protestator-conan $ARTIFACTORY_URL
        conan remote login -p $ARTIFACTORY_TOKEN protestator-conan $ARTIFACTORY_USER
        conan remote remove conancenter
    - name: prepare dependencies
      run: |
       mkdir build && cd build
       conan install .. --build missing -o "&:with_check=True"
    - name: build sysmlv2lib
      run: |
        cd build
        conan build .. --version=wip -o "&:with_check=True"
    - name: test
      shell: cmd
      run: |
        rem the dependencies are shared libraries in the Conan cache: conanrun.bat puts their DLLs on PATH
        call build\generators\conanrun.bat && ctest --test-dir build -C Release --output-on-failure --timeout 1800
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-logs-windows
        path: build/Testing/Temporary/
