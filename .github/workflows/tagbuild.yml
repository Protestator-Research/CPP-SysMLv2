name: Build For Tag

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    env: # Or as an environment variable
      ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
      ARTIFACTORY_USER: ${{secrets.ARTIFACTORY_USERNAME}}
      VERSION: ${{ github.ref_name }}
    steps:
    - uses: actions/checkout@v4
    - name: prepare runner
      run: | 
        sudo apt update && sudo apt -y install make autoconf python3 python3-pip cmake libgl-dev libgl1-mesa-dev xkb-data libx11-xcb-dev libfontenc-dev libxaw7-dev libxcomposite-dev libxcursor-dev libxdamage-dev libxfixes-dev libxi-dev libxinerama-dev libxkbfile-dev libxmu-dev libxmuu-dev libxpm-dev libxrandr-dev libxres-dev libxss-dev libxtst-dev libxv-dev libxxf86vm-dev libxcb-glx0-dev libxcb-render-util0-dev libxcb-xkb-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev libxcb-dri3-dev libxcb-cursor-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev libxcb-composite0-dev libxcb-ewmh-dev libxcb-res0-dev libxcb-util-dev uuid-dev
        sudo pip install --ignore-installed --upgrade conan
        conan profile detect
        conan remote add protestator-conan $ARTIFACTORY_URL
        conan remote login -p $ARTIFACTORY_TOKEN protestator-conan $ARTIFACTORY_USER
        conan remote remove conancenter
    - name: prepare dependencies
      run: |
       mkdir build && cd build
       conan install .. --build missing
    - name: build sysmlv2lib
      run: |
        ls -al
        cd build
        conan create .. --version=$VERSION --build missing
        conan create .. --version=$VERSION -s build_type=Debug --build missing
        conan upload "sysmllib/*" -c -r protestator-conan
    - name: deploy and package binaries
      run: |
        for bt in Release Debug; do
          conan install --requires="sysmllib/$VERSION" -s build_type=$bt --deployer=direct_deploy --deployer-folder="dist/$bt"
          tar -czf "dist/sysmllib-$VERSION-linux-x86_64-$bt.tar.gz" -C "dist/$bt/direct_deploy/sysmllib" .
        done
    - uses: actions/upload-artifact@v4
      with:
        name: sysmllib-linux-x86_64
        path: dist/*.tar.gz
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
      ARTIFACTORY_USER: ${{secrets.ARTIFACTORY_USERNAME}}
      VERSION: ${{ github.ref_name }}
      CONAN_HOME: C:\c2
    steps:
    - name: enable long paths
      run: git config --system core.longpaths true
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/cache@v4
      with:
        path: C:\c2\p
        key: conan-windows-pkg-${{ hashFiles('conanfile.py') }}
        restore-keys: conan-windows-pkg-
    - name: prepare runner
      run: |
        pip install --upgrade conan
        conan profile detect --force
        # MSVC is detected with C++14, the project and antlr4 need a newer standard
        sed -i 's/^compiler.cppstd=.*/compiler.cppstd=20/' "$(conan profile path default)"
        conan remote add --force protestator-conan $ARTIFACTORY_URL
        conan remote login -p $ARTIFACTORY_TOKEN protestator-conan $ARTIFACTORY_USER
        conan remote remove conancenter
    - name: prepare dependencies
      run: |
       mkdir build && cd build
       conan install .. --build missing
    - name: build sysmlv2lib
      run: |
        ls -al
        cd build
        conan create .. --version=$VERSION --build missing
        conan create .. --version=$VERSION -s build_type=Debug --build missing
        conan upload "sysmllib/*" -c -r protestator-conan
    - name: deploy and package binaries
      run: |
        for bt in Release Debug; do
          conan install --requires="sysmllib/$VERSION" -s build_type=$bt --deployer=direct_deploy --deployer-folder="dist/$bt"
          7z a "dist/sysmllib-$VERSION-windows-x86_64-$bt.zip" "./dist/$bt/direct_deploy/sysmllib/*"
        done
    - uses: actions/upload-artifact@v4
      with:
        name: sysmllib-windows-x86_64
        path: dist/*.zip
        if-no-files-found: error

  wasm:
    uses: ./.github/workflows/wasm.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  release:
    needs: [build, build-windows, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.tar.gz
          dist/*.zip
